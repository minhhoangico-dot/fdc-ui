<!-- @dsCard group="Organisms" height=690 subtitle="nursing home contact" -->
<div id="root" style="max-width:420px;background:var(--brand-200);padding:16px;font-family:var(--font-sans)"></div>
<script>
var h = React.createElement, F = window.FDC;
function Demo() {
  var s = React.useState(null), notice = s[0], setNotice = s[1];
  return h(F.ContactForm, {intro: 'Khi bạn có nhu cầu hãy liên hệ ngay với chúng tôi.', notice: notice,
    onSubmit: function () { setNotice({type: 'success', text: 'Đã gửi. Chúng tôi sẽ gọi lại cho bạn sớm.'}); }});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
