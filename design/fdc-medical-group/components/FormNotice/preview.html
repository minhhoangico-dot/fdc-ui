<!-- @dsCard group="Molecules" height=330 subtitle="status line under a form; boxed notice on its own" -->
<div id="root" style="padding:16px;max-width:640px"></div>
<script>
var h = React.createElement, F = window.FDC;
ReactDOM.createRoot(document.getElementById('root')).render(h(F.Stack, {gap: 15},
  h(F.FormNotice, {notice: {type: 'success', text: 'Đã gửi. Chúng tôi sẽ gọi lại cho bạn trong 30 phút.'}}),
  h(F.FormNotice, {notice: {type: 'error', text: 'Chúng tôi chưa gửi được. Vui lòng thử lại hoặc gọi 024 35 430 430.'}}),
  h(F.FormNotice, {boxed: true, notice: {type: 'warning', text: 'Hồ sơ này còn 3 mục còn thiếu. Điền đủ trước khi gửi lên Sở.'}}),
  h(F.FormNotice, {boxed: true, notice: {type: 'error', text: 'Chưa gửi được lên Sở. Kiểm tra mạng rồi bấm Gửi lại.'}})));
</script>
