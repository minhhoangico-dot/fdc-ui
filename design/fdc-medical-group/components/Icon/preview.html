<!-- @dsCard group="Atoms" height=200 subtitle="24 glyphs from the FDC sites" -->
<div id="root" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;color:var(--ink);padding:16px;font-family:var(--font-sans)"></div>
<script>
var h = React.createElement, F = window.FDC;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  F.iconNames.map(function (n) {
    return h('div', {key: n, style: {display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, fontSize: 11, color: 'var(--ink-muted)'}},
      h('span', {style: {color: 'var(--brand-600)'}}, h(F.Icon, {name: n, size: 24})), n);
  })));
</script>
