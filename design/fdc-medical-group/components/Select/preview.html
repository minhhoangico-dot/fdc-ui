<!-- @dsCard group="Atoms" height=280 subtitle="native select styled like TextField; list filter with counts; lines up in a FieldRow" -->
<div id="root" style="display:flex;flex-direction:column;gap:24px;padding:16px" data-density="compact"></div>
<script>
var h = React.createElement, F = window.FDC;
var groups = [['can-lam', 'Cần điền hoặc sửa', 1019], ['xem-lai', 'Sẵn sàng xem lại', 253], ['dang-cho', 'Đang chờ', 253], ['dang-gui', 'Đang gửi', 2], ['da-gui', 'Sở đã tiếp nhận', 506], ['tat-ca', 'Tất cả', 2033]];
var classes = ['I', 'II', 'III', 'IV', 'V'].map(function (v) { return {value: v, label: 'Loại ' + v}; });
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h('div', {style: {maxWidth: '360px'}},
    h(F.Select, {label: 'Nhóm người', defaultValue: 'can-lam', options: groups.map(function (g) {
      return {value: g[0], label: g[1] + ' · ' + g[2].toLocaleString('vi-VN')};
    })})),
  h(F.FieldRow, {minColumn: '12rem'},
    h(F.TextField, {label: 'Nơi làm việc', hint: 'Ghi đủ tên công ty như trên hợp đồng', defaultValue: 'Công ty TNHH Rạng Đông'}),
    h(F.Select, {label: 'Phân loại sức khỏe', defaultValue: 'II', options: classes}),
    h(F.Select, {label: 'Nhóm máu', required: true, defaultValue: '', error: 'Chọn nhóm máu'},
      h('option', {value: '', disabled: true}, 'Chưa chọn'),
      h('option', {value: 'O'}, 'O'), h('option', {value: 'A'}, 'A'), h('option', {value: 'B'}, 'B'), h('option', {value: 'AB'}, 'AB')))));
</script>
