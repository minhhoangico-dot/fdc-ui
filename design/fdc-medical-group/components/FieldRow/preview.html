<!-- @dsCard group="Layout" height=330 subtitle="fields side by side; labels and inputs line up; compact density for staff" -->
<div id="root" style="padding:16px;display:flex;flex-direction:column;gap:28px"></div>
<script>
var h = React.createElement, F = window.FDC;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(F.FieldRow, null,
    h(F.TextField, {label: 'Họ và tên', defaultValue: 'Phạm Văn Nam'}),
    h(F.TextField, {label: 'Mã bệnh nhân', hint: 'In ở góc trên phiếu khám'}),
    h(F.TextField, {label: 'Năm sinh', defaultValue: '58', error: 'Nhập năm sinh gồm 4 chữ số, ví dụ 1958'})),
  h('div', {'data-density': 'compact'},
    h(F.FieldRow, {minColumn: '11rem'},
      h(F.TextField, {label: 'Chiều cao (cm)', placeholder: 'Chưa điền · ví dụ 162'}),
      h(F.TextField, {label: 'Cân nặng (kg)', placeholder: 'Chưa điền · ví dụ 58'}),
      h(F.TextField, {label: 'Mạch (lần/phút)', hint: 'Đo khi nghỉ', placeholder: 'Chưa điền · ví dụ 78'}),
      h(F.TextField, {label: 'Huyết áp (mmHg)', defaultValue: '150/95'})))));
</script>
