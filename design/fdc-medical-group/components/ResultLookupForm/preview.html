<div id="root" style="background:var(--surface-alt);padding:16px;font-family:var(--font-sans)"></div>
<script>
var h = React.createElement, F = window.FDC;
function Demo() {
  var s = React.useState(null), notice = s[0], setNotice = s[1];
  return h(F.ResultLookupForm, {notice: notice, onSubmit: function () { setNotice({type: 'success', text: 'Đã tìm thấy kết quả ngày khám.'}); }});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
